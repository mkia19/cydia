<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@REPO_LABEL@</title>
<link rel="apple-touch-icon" href="CydiaIcon.png">
<link rel="stylesheet" href="depictions/depiction.css">
<style>
  .center { text-align: center; padding: 20px 10px; }
  .center img { width: 64px; height: 64px; }
  .btn {
    display: block; margin: 14px 0 0; padding: 12px;
    background: #3a76d0; color: #fff; text-decoration: none; font-weight: bold;
    -webkit-border-radius: 8px; border-radius: 8px;
  }
  .url { font-family: Courier, monospace; word-wrap: break-word; }
</style>
</head>
<body>
<div class="group">
  <div class="center">
    <img src="CydiaIcon.png" alt="">
    <h1>@REPO_LABEL@</h1>
    <p>@REPO_DESCRIPTION@</p>
    <a class="btn" href="cydia://url/https://cydia.saurik.com/api/share#?source=@REPO_URL@/">Add to Cydia</a>
  </div>
</div>

<p class="label">Or add it manually</p>
<div class="group">
  <div class="row">Cydia &rarr; Sources &rarr; Edit &rarr; Add, then enter:</div>
  <div class="row url">@REPO_URL@/</div>
</div>
</body>
</html>
